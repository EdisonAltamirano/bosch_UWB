services:
  uwb:
    build:
      network: host
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/bus/usb/:/dev/bus/usb
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /etc/udev/rules.d:/etc/udev/rules.d
      - ${SSH_AUTH_SOCK:-/dev/null}:${SSH_AUTH_SOCK:-/dev/null}
    devices:
      - /dev/dri:/dev/dri
