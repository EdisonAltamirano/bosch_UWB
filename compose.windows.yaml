services:
  uwb:
    # Docker Desktop on Windows does not support network_mode: host.
    # Containers reach the Windows host via the special DNS name below.
    # Explicit UDP port mappings are required so that packets from the STM32
    # (physical Ethernet) can reach nodes inside the container:
    #   20000/udp — CIR frame data from STM32 → uwb_udp_frame_publisher
    #   20001/udp — legacy_tlv ACK from STM32 → uwb_node (legacy_tlv mode only)
    ports:
      - "20000:20000/udp"
      - "20001:20001/udp"
    environment:
      # Requires an X server on Windows (e.g. VcXsrv / Xming).
      # Start VcXsrv with "Disable access control" checked, then run make uwb.up.
      DISPLAY: host.docker.internal:0.0
      QT_X11_NO_MITSHM: "1"
